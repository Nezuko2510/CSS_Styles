<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>OverFlow</title>
        <style>
            body{
                font-family:Ariel; 
                background-color: rgba(232, 122, 122, 0.84);
            }
            .box {
                width: 200px;
                height:70px;
                padding:10px;
                margin: 4rem 0;
                border: 2px solid rgba(105, 25, 25, 0.86);
                background-color: rgb(225, 172, 172);
            }
            .visible-box{
                overflow: auto;
            }
        </style>
    </head>
    <body>
        <h2> CSS Overflow </h2>
        <div class="box visible-box">
            <strong>Malla Reddy University</strong><br>Hyderabad is dedicated to creating a vibrant learning environment that 
            encourages research and development.
        </div>
    </body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            width: 20%;
            background-color: red;
            color: yellow;
            padding: 15px;
            text-align: center;
            animation-name: first;
            animation-duration: 30s;
            animation-iteration-count: infinite;
            position: relative;
            animation-direction: normal;
            animation-delay: 3s;
            animation-fill-mode: backwards;
        }

        @keyframes first{
            0%{background-color: red; color: yellow; left:0%; top:0%;}
            15%{background-color: yellow; color: rgb(7,1,1); left:80%; top:0;}
            30%{background-color: bisque; color: black; left:40%; top:40%;}
            50%{background-color: black; color: white; left:80%; top:70%;}
            70%{background-color: aqua; color: pink; left:0%; top:70%;}
            85%{background-color: darkgray; color: gold; left:40%; top:40%;}
            100%{background-color: rgb(206,33,183); color: black; left:0%; top:0%;}
        }
    </style>
</head>
<body style="text-align: center;">
    <div>
        <h1 style="font-style: oblique;">Hello World</h1>
    </div>
</body>
</html>

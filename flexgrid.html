<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex-Grid</title>
    <style>
        h1 {
            text-align: center;
            text-decoration: underline;
        }
        h1:hover , div:hover{
            color:sandybrown;
            font-family: papyrus, fantasy;
        }
        .main{
            background-color: rgb(0, 0, 0);
            border: 3px solid burlywood;
            padding: 5px;
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
/*             gap: 30px;
 */
            justify-content: space-evenly;
        }
        iner > div{
            background-color: rgb(234, 197, 14);
            font-size: 30px;
            border: 2px solid #ffffff;
            margin: 5px;
            text-align: center;
        }
        .main > div{
            background-color: rgb(118, 20, 20);
            font-size: 30px;
            border: 1px solid black;
            margin: 5px;
            text-align: center;
            color: bisque;
        }
        .item1{
            grid-row-start: 1;
            grid-column-end: 3;
        }
        .item2{
            grid-column-start: 1;
            grid-row-end: 2;
        }
        .item3{
            grid-row-start: 1;
            grid-row-end: 4;
        }
        .item5{
            grid-row-start: 3;
            grid-row-end: 6;
        }
        .item4{
            grid-column-start: 1;
            grid-column-end: 4;
        }
    </style>
</head>
<body>
    <h1>Basic Flex-Grid</h1>
    <div class="main">
    <div class="item1">1</div>
    <div class="item2">2</div>
    <div class="item3">3</div>
    <div class="item4">4</div>
    <div class="item5">5</div>             
    <div>6</div>             
    <div>7</div>             
    <div>8</div>             
    <div>9</div>             
    <div>0</div>             
    </div>          
</body>
</html>

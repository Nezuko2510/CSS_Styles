<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rotate</title>
    <style>
        .example{
            width: 100px;
            height: 100px;
            border: 2px solid black;
            background-color: bisque;
        }
        body{
            margin: 100px;
        }
        .example{
            transform: skew(20deg,10deg) ;
        }
    </style>
</head>
<body>
    <div class="example"></div>
</body>
</html>
